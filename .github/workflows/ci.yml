# Integracao continua do fornecedores-service.
# Roda a cada push no repositorio: baixa o codigo, prepara o Java 17
# e compila o microsservico com o Maven.
name: CI - fornecedores-service

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compilar o fornecedores-service
        run: mvn -B package --file fornecedores-service/pom.xml
