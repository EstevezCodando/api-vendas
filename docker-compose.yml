services:

  # --- Service Discovery ---
  eureka-server:
    build: ./eureka-server        # usa o Dockerfile dessa pasta pra construir a imagem
    container_name: eureka-server # nome fixo do container (e nome que os outros usam na rede)
    ports:
      - "8761:8761"                # porta_da_maquina:porta_do_container -> localhost:8761
    # "healthy" so quando o painel do Eureka responde de verdade
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8761/"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 15s
    networks:
      - microservicos-net           # entra na rede compartilhada com os outros serviços

  # --- Configurações centralizadas (lê o config-repo) ---
  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    volumes:
      # monta a pasta config-repo (do seu Mac) dentro do container em /config-repo
      - ./config-repo:/config-repo
    environment:
      # backend "native" = le os .properties direto da pasta montada acima.
      # O config-repo/ e uma pasta comum, sem .git, entao o backend git
      # (spring.cloud.config.server.git.uri) nao funciona aqui: ele exige um
      # repositorio Git de verdade e falha com "No .git at file:///config-repo".
      # Sem configuracao, os servicos subiriam sem server.port, na porta 8080,
      # e as portas publicadas abaixo apontariam para onde ninguem escuta.
      - SPRING_PROFILES_ACTIVE=native
      - SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS=file:///config-repo
    # "healthy" so quando ele ja consegue servir configuracao. Sem isso os
    # servicos sobem antes, nao recebem server.port e ficam todos na 8080.
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8888/application/default"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 15s
    networks:
      - microservicos-net

  # --- Serviço de produtos ---
  produtos-service:
    build: ./produtos-service
    container_name: produtos-service
    depends_on:                    # espera os dois estarem PRONTOS, nao so criados
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      # troca "localhost" por "config-server", o nome do serviço na rede Docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      # ativa o profile "docker", que faz o config-server servir também
      # produtos-service-docker.properties (sobrescreve a URL do Eureka)
      - SPRING_PROFILES_ACTIVE=docker
      # troca "localhost" por "eureka-server", idem
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    ports:
      - "8081:8081"
    # "healthy" quando a aplicacao ja responde na porta dela. O gateway espera
    # por isso: se ele subir antes, monta a tabela de rotas vazia e devolve 404.
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8081/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    networks:
      - microservicos-net

  # --- Serviço de vendas ---
  vendas-service:
    build: ./vendas-service
    container_name: vendas-service
    depends_on:                    # espera os dois estarem PRONTOS, nao so criados
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      # ativa o profile "docker", que faz o config-server servir também
      # vendas-service-docker.properties (sobrescreve a URL do Eureka)
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    ports:
      - "8082:8082"
    # "healthy" quando a aplicacao ja responde na porta dela. O gateway espera
    # por isso: se ele subir antes, monta a tabela de rotas vazia e devolve 404.
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8082/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    networks:
      - microservicos-net
  
  clientes-service:
    build: ./clientes-service
    container_name: clientes-service
    depends_on:                    # espera os dois estarem PRONTOS, nao so criados
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      # ativa o profile "docker", que faz o config-server servir também
      # vendas-service-docker.properties (sobrescreve a URL do Eureka)
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    ports:
      - "8083:8083"
    # "healthy" quando a aplicacao ja responde na porta dela. O gateway espera
    # por isso: se ele subir antes, monta a tabela de rotas vazia e devolve 404.
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8083/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    networks:
      - microservicos-net

  # --- Servico de cadastro de usuarios ---
  auth-service:
    build: ./auth-service
    container_name: auth-service
    depends_on:                    # espera os dois estarem PRONTOS, nao so criados
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      # ativa o profile "docker", que faz o config-server servir também
      # auth-service-docker.properties (sobrescreve a URL do Eureka)
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    ports:
      - "8086:8086"
    # "healthy" quando a aplicacao ja responde na porta dela. O gateway espera
    # por isso: se ele subir antes, monta a tabela de rotas vazia e devolve 404.
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8086/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    networks:
      - microservicos-net

  # --- Servico de fornecedores (AT) ---
  fornecedores-service:
    build: ./fornecedores-service
    container_name: fornecedores-service
    depends_on:                    # espera os dois estarem PRONTOS, nao so criados
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      # troca "localhost" por "config-server", o nome do servico na rede Docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      # ativa o profile "docker", que faz o config-server servir tambem
      # fornecedores-service-docker.properties (sobrescreve a URL do Eureka)
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    ports:
      - "8084:8084"
    # "healthy" quando a aplicacao ja responde na porta dela. O gateway espera
    # por isso: se ele subir antes, monta a tabela de rotas vazia e devolve 404.
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8084/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    networks:
      - microservicos-net

  # --- API Gateway (porta de entrada única, roteia por nome de serviço no Eureka) ---
  gateway:
    build: ./gateway
    container_name: gateway
    depends_on:                    # so sobe depois que os servicos ja estao registrados
      eureka-server:
        condition: service_healthy
      produtos-service:
        condition: service_healthy
      vendas-service:
        condition: service_healthy
      clientes-service:
        condition: service_healthy
      fornecedores-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    ports:
      - "8085:8085"
    networks:
      - microservicos-net

# Rede virtual que conecta todos os containers acima. É o que permite
# um container chamar o outro pelo nome (ex: http://eureka-server:8761)
# em vez de precisar saber um IP.
networks:
  microservicos-net:
    driver: bridge   # tipo padrão de rede local isolada do Docker